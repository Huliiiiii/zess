[package]
name = "helix-loader"
description = "Build bootstrapping for Helix crates"
version = "25.7.1"
authors = ["Blaž Hrastnik <blaz@mxxn.io>"]
edition = "2021"
license = "MPL-2.0"
rust-version = "1.90"
categories = ["editor"]
repository = "https://github.com/helix-editor/helix"
homepage = "https://helix-editor.com"

[[bin]]
name = "hx-loader"
path = "src/main.rs"

[dependencies]
helix-stdx = { git = "https://github.com/helix-editor/helix", rev = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc" }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
etcetera = "0.11"
parking_lot = "0.12"
sha2 = "0.11"
globset = "0.4"
log = "0.4"
cc = "1.10"
threadpool = "1.0"
tempfile = "3.27.0"
tree-house = { version = "0.4", default-features = false }
