[package]
name = "zess-terminal"
version.workspace = true
edition.workspace = true

[dependencies]
zess-build.workspace = true
anyhow.workspace = true
crossterm = { workspace = true, features = ["osc52"] }
serde_json.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
zess-ui.workspace = true
zess-protocol.workspace = true
zess-ipc.workspace = true
zess-platform = { path = "../zess-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
