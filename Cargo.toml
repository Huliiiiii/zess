[workspace]
members = ["crates/*"]
exclude = ["vendor/steel-core", "vendor/helix-loader"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
git2 = { version = "0.21.0", default-features = false, features = ["unstable-sha256"] }
gix = { version = "0.90.0", default-features = false, features = ["sha1", "sha256"] }
insta = { version = "1.49.0", features = ["json"] }
hegel = { package = "hegeltest", version = "0.50.3", features = ["static-engine"] }
globset = "0.4.21"
regex = "1.13.1"
ignore = "0.4.33"
notify = "8.2.1"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crossterm = "=0.29.0"
libc = "0.2.191"
toml = "1.1"
unicode-width = "0.2.2"
vte = "0.15.0"
unicode-segmentation = "=1.13.3"
etcetera = "0.11"
tempfile = "=3.27.0"
fnv = "1.0.7"
string-interner = "0.20.0"
smallvec = "1.16.4"
blart = "0.6.0"
fst = "0.4.7"
trie-rs = "0.4.2"
yada = "0.7.0"
qp-trie = "0.8.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
helix-loader = { path = "vendor/helix-loader" }
helix-core = { git = "https://github.com/helix-editor/helix", rev = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc" }
helix-stdx = { git = "https://github.com/helix-editor/helix", rev = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc" }
steel-core = { path = "vendor/steel-core", default-features = false, features = ["std", "modules", "sandbox"] }
zess-filter = { path = "crates/zess-filter" }
zess-platform = { path = "crates/zess-platform" }
zess-remote = { path = "crates/zess-remote" }
zess-ui = { path = "crates/zess-ui" }
zess-protocol = { path = "crates/zess-protocol" }
zess-ipc = { path = "crates/zess-ipc" }
zess-text = { path = "crates/zess-text" }
zess-script = { path = "crates/zess-script" }
zess-git = { path = "crates/zess-git" }
zess-services = { path = "crates/zess-services" }
zess-session = { path = "crates/zess-session" }
zess-terminal = { path = "crates/zess-terminal" }
zess-wisp = { path = "crates/zess-wisp" }
zess-plugin = { path = "crates/zess-plugin" }
zess-plugins = { path = "crates/zess-plugins" }

[package]
name = "zess"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
zess-protocol.workspace = true
zess-ipc.workspace = true
zess-session.workspace = true
zess-terminal.workspace = true
zess-text.workspace = true

[dev-dependencies]
fnv.workspace = true
serde.workspace = true
tempfile.workspace = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[patch."https://github.com/helix-editor/helix"]
helix-loader = { path = "vendor/helix-loader" }
