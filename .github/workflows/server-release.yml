name: Server release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: target/x86_64-unknown-linux-gnu/release/zess
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: target/x86_64-pc-windows-msvc/release/zess.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/server-build.sh prepare '${{ matrix.target }}'
      - name: Test Windows console mode restoration
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-platform --lib console::tests -- --nocapture
      - name: Test Windows terminal lifecycle
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-terminal --lib terminal::tests::windows -- --nocapture
      - name: Build Linux server
        if: runner.os == 'Linux'
        run: bash scripts/server-build.sh build '${{ matrix.target }}'
      - name: Build Windows server
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/server-build.sh build '${{ matrix.target }}'
      - name: Package Linux server
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash scripts/server-build.sh package '${{ matrix.target }}' '${{ matrix.binary }}'
          mkdir smoke
          tar -xzf dist/zess-server-x86_64-unknown-linux-gnu.tar.gz -C smoke
          smoke/patchelf --set-interpreter "$PWD/smoke/lib/ld-linux-x86-64.so.2" --set-rpath "\$ORIGIN/lib" smoke/zess
          smoke/zess --version
      - name: Package Windows server
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/server-build.sh package '${{ matrix.target }}' '${{ matrix.binary }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          build_id=$(python scripts/server-release.py manifest artifacts release)
          tag="build-$build_id"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --dir existing
            python scripts/server-release.py verify existing "$build_id"
            echo "Release $tag already contains verified artifacts."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes '' release/*
          fi
