name: Server release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - preview
          - stable
        default: preview

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set release version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$CHANNEL" = preview ]; then
            version="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "release=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    env:
      ZESS_RELEASE_VERSION: ${{ needs.version.outputs.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: target/x86_64-unknown-linux-gnu/release/zess
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: target/x86_64-pc-windows-msvc/release/zess.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/server-build.sh prepare '${{ matrix.target }}'
      - name: Test Windows console mode restoration
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-platform --lib console::tests -- --nocapture
      - name: Test Windows process lifecycle
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-platform --lib process::tests -- --nocapture
      - name: Test Windows terminal lifecycle
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-terminal --lib terminal::tests::windows -- --nocapture
      - name: Test Windows remote connection UI
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-terminal --lib connection::tests -- --nocapture
      - name: Test Windows SSH askpass
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-remote --lib askpass::tests -- --nocapture
      - name: Test Windows Git paths
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p zess-git --lib status_and_decorations_preserve_workspace_relative_git_paths
      - name: Test Windows session discovery
        if: runner.os == 'Windows'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --test session_manager discovery_
      - name: Build Linux server
        if: runner.os == 'Linux'
        run: bash scripts/server-build.sh build '${{ matrix.target }}'
      - name: Build Windows server
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/server-build.sh build '${{ matrix.target }}'
      - name: Package Linux server
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash scripts/server-build.sh package '${{ matrix.target }}' '${{ matrix.binary }}'
          mkdir smoke
          tar -xzf dist/zess-server-x86_64-unknown-linux-gnu.tar.gz -C smoke
          smoke/patchelf --set-interpreter "$PWD/smoke/lib/ld-linux-x86-64.so.2" --set-rpath "\$ORIGIN/lib" smoke/zess
          smoke/zess --version
      - name: Package Windows server
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/server-build.sh package '${{ matrix.target }}' '${{ matrix.binary }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZESS_RELEASE_VERSION: ${{ needs.version.outputs.release }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          python3 scripts/server-release.py manifest artifacts release "$ZESS_RELEASE_VERSION"
          tag="v$ZESS_RELEASE_VERSION"
          flags=()
          if [ "$CHANNEL" = preview ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes '' "${flags[@]}" release/*
